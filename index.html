<!DOCTYPE html>
<html lang="en">
    <head>
        <title>EMOTIONAL SYNTH</title>
        <link rel="stylesheet" href="css/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
        <script src="script/jscript3.js" defer></script>
    </head>
<body>
    <section class="synth">
        <div class="container1">
            <h1 class="heading">EMOTIONAL<br />SYNTH</h1>
            <h2 class="emotion">CHOOSE YOUR<br />EMOTION</h2>
            <div class="emotion-buttons">
                <button class="emotion-btn active" data-emotion="happiness">happiness</button>
                <button class="emotion-btn" data-emotion="anger">anger</button>
                <button class="emotion-btn" data-emotion="sadness">sadness</button>
            </div>
        </div>
        <div class="wavetype">
            <p>wave type</p>
            <div class="wave-buttons">
                <button class="wave-btn active" data-type="sine">sine</button>
                <button class="wave-btn" data-type="square">square</button>
                <button class="wave-btn" data-type="sawtooth">sawtooth</button>
                <button class="wave-btn" data-type="triangle">triangle</button>
            </div>
        </div>
        <div class="reverb">
        <p>freeverb</p>
        </div>
        <div class="freeverbcont">
            <div class="slider-thumb"></div>
        </div>
        <div class="delay">
            <p>delay</p>
        </div>
        <div class="delaycont">
            <div class="slider-thumb1"></div>
        </div>
        <div class="chorus">
            <p>phaser</p>
        </div>
        <div class="choruscont">
            <div class="slider-thumb2"></div>
        </div>
        <div class="distortion">
            <p>distortion</p>
        </div>
        <div class="distortioncont">
            <div class="slider-thumb3"></div>
        </div>
        <div class="envelope">
            <p>envelope</p>
        </div>
        <div class="attackcont">
            <div class="slider-thumba">
                <div class="attack">
                    <p>a</p>
                </div>
            </div>
        </div>
        <div class="decaycont">
            <div class="slider-thumbd">
                <div class="decay">
                    <p>d</p>
                </div>
            </div>
        </div>
        <div class="sustaincont">
            <div class="slider-thumbs">
                <div class="sustain">
                    <p>s</p>
                </div>
            </div>
        </div>
        <div class="releasecont">
            <div class="slider-thumbr">
                <div class="release">
                    <p>r</p>
                </div>
            </div>
        </div>
        <div class="circles">
        <div class="calmnesscont">
            <div class="calmcontroller"></div>
            <div class="mark"></div>
        </div>
        <div class="calmness">
            <p>calmness</p>
        </div>
        <div class="dot"></div>
        
        <div class="inspirationcont">
            <div class="inspocontroller"></div>
            <div class="mark2"></div>
        </div>
        <div class="inspo">
            <p>inspiration</p>
        </div>
        <div class="dot2"></div>
        
        <div class="gratitudecont">
            <div class="gratcontroller"></div>
            <div class="mark3"></div>
        </div>
        <div class="gratitude">
            <p>gratitude</p>
        </div>
        <div class="dot3"></div>
        
        <div class="volumecont">
            <div class="volumecontroller"></div>
            <div class="mark4"></div>
        </div>
        <div class="volume">
            <p>volume</p>
        </div>
        <div class="dot4"></div>
        
        <div class="mutecont">
            <button id="mutecontroller" class="mutecontroller"></button>
        </div>
        <div class="mute">
            <p>mute</p>
        </div>
        </div>
    </section>
